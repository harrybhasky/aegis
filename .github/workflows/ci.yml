name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Dry-run orchestrator (mocked env)
        run: |
          python orchestrator_langgraph.py --rtl src/example_top.v --max-iterations 1
